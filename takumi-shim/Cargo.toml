[package]
name = "takumi-shim"
version = "0.0.1-dev.0"
edition = "2024"

[dependencies]
lru = "0.16.2"
rayon = "1.11.0"
once_cell = "1.20.0"
libc = "0.2"
serde_json = "1.0"


[dependencies.takumi]
version = "0.51.2"
# path = "../../upstream-takumi/takumi"
features = ["woff2", "woff", "svg", "rayon", "avif"]
default-features = false

[build-dependencies]
cc = "1.2.39"
bindgen = "0.72.1"
cbindgen = "0.29.0"


[lib]
crate-type = ["cdylib", "staticlib"]
